name: Сборка Tabel (.exe и .apk)

on:
  push:
    branches: [ main, master, windows-sync-v2 ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------- WINDOWS .EXE
  windows-exe:
    name: Windows — Tabel.exe
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt

      - name: Тесты ядра
        run: python test_core.py

      - name: Сборка exe
        working-directory: windows
        run: python -m PyInstaller tabel.spec --noconfirm --clean

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: Tabel-windows-exe
          path: windows/dist/Tabel.exe
          if-no-files-found: error

  # --------------------------------------------------------------- ANDROID APK
  # Рецепт приведён к проверенному зелёному workflow android.yml:
  # без несуществующего пакета libltdl-7 и без преждевременного
  # ANDROID_NDK_HOME (buildozer сам скачивает NDK r25b по buildozer.spec).
  android-apk:
    name: Android — tabel.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            build-essential automake autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev libltdl-dev python3-dev

      - name: Buildozer
        run: pip install -q buildozer cython==0.29.36 virtualenv

      - name: Копирование общего ядра в проект
        run: |
          for f in timecard_core reports sync_client; do
            if [ -f "core/$f.py" ]; then cp "core/$f.py" android/; fi
          done

      - name: Валидация Android-модулей
        working-directory: android
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_restore.py' -v
          test -f java/org/tabel/bridge/WorksEditor.java
          test -f java/org/tabel/bridge/DocumentReader.java

      - name: Сборка apk
        working-directory: android
        run: buildozer -v android debug

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: Tabel-android-apk
          path: android/bin/*.apk
          if-no-files-found: error
