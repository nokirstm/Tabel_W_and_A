name: Релиз (Tabel.exe + tabel.apk)

on:
  push:
    branches: [windows-sync-v2]
    paths:
      - "windows/**"
      - "core/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Код ветки windows-sync-v2
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Зависимости и PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt
          pip install pyinstaller

      - name: Сборка EXE
        working-directory: windows
        run: pyinstaller tabel.spec --noconfirm --distpath dist --workpath build

      - name: Артефакт EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tabel-windows-exe
          path: windows/dist/*.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Код Android из ветки android-backup-v1
        uses: actions/checkout@v4
        with:
          ref: android-backup-v1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Системные пакеты и buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev cmake
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Сборка APK
        working-directory: android
        run: buildozer -v android debug

      - name: Артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabel-android-apk
          path: android/bin/*.apk

  publish-release:
    runs-on: ubuntu-latest
    needs: [windows-exe, android-apk]
    steps:
      - name: Скачать оба артефакта
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Привести имена к постоянным
        run: |
          mkdir -p assets
          find out -name "*.exe" | head -n1 | xargs -I{} cp {} assets/Tabel-windows.exe
          find out -name "*.apk" | head -n1 | xargs -I{} cp {} assets/tabel.apk
          ls -la assets

      - name: Пересоздать релиз latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create latest --repo "${{ github.repository }}" \
            --title "Актуальная сборка (exe + apk)" \
            --notes "EXE: windows-sync-v2, коммит ${{ github.sha }}. APK: android-backup-v1 на момент сборки." \
            assets/Tabel-windows.exe assets/tabel.apk
