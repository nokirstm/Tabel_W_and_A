name: Релиз (Tabel.exe + tabel.apk)

on:
  push:
    branches: [windows-sync-v2, android-backup-v1]
    paths:
      - "windows/**"
      - "core/**"
      - "android/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Код ветки windows-sync-v2
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: windows-sync-v2

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Зависимости и PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt
          pip install pyinstaller

      - name: Сборка EXE
        working-directory: windows
        run: pyinstaller tabel.spec --noconfirm --distpath dist --workpath build

      - name: Артефакт EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tabel-windows-exe
          path: windows/dist/*.exe

  android-apk:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Код Android из ветки android-backup-v1
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: android-backup-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            build-essential automake autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev libltdl-dev python3-dev

      - name: Install Buildozer
        run: pip install -q buildozer cython==0.29.36 virtualenv

      - name: Validate Android-only runtime modules
        working-directory: android
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_restore.py' -v
          test -f java/org/tabel/bridge/WorksEditor.java
          test -f java/org/tabel/bridge/DocumentReader.java
          echo "Source commit: $(git rev-parse HEAD)"

      - name: Сборка APK
        working-directory: android
        run: buildozer -v android debug

      - name: Артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabel-android-apk
          path: android/bin/*.apk
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [windows-exe, android-apk]
    steps:
      - name: Скачать оба артефакта
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Привести имена к постоянным
        run: |
          mkdir -p assets
          find out -name "*.exe" | head -n1 | xargs -I{} cp {} assets/Tabel-windows.exe
          find out -name "*.apk" | head -n1 | xargs -I{} cp {} assets/tabel.apk
          ls -la assets

      - name: Пересоздать релиз latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create latest --repo "${{ github.repository }}" \
            --title "Актуальная сборка (exe + apk)" \
            --notes "EXE: windows-sync-v2 @ ${{ needs.windows-exe.outputs.sha }}
          APK: android-backup-v1 @ ${{ needs.android-apk.outputs.sha }}
          Триггер: ${{ github.event_name }}, коммит ${{ github.sha }}" \
            assets/Tabel-windows.exe assets/tabel.apk
